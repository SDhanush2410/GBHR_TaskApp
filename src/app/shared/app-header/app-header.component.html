
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>GB HERMES</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="toggleMenu()">
        <ion-icon
          [name]="menuOpen ? 'close-outline' : 'menu-outline'"
          slot="icon-only">
        </ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <div class="dropdown-menu" *ngIf="menuOpen">
    <ion-list>

      <ion-item button (click)="navigateTo('/home')">
        <ion-icon name="home-outline" slot="start"></ion-icon>
        <ion-label>Home</ion-label>
      </ion-item>

      <ion-item button (click)="navigateTo('/profile')">
        <ion-icon name="person-outline" slot="start"></ion-icon>
        <ion-label>Profile</ion-label>
      </ion-item>

      <ion-item button (click)="navigateTo('/attendance')">
        <ion-icon name="calendar-outline" slot="start"></ion-icon>
        <ion-label>Attendance</ion-label>
      </ion-item>

      <!-- Trip Menu -->
      <ion-item button (click)="navigateTo('/trip')">
        <ion-icon name="navigate-outline" slot="start"></ion-icon>
        <ion-label>Trip</ion-label>
      </ion-item>

      <!-- Chat Menu -->
      <ion-item button (click)="navigateTo('/chat')">
        <ion-icon name="chatbubbles-outline" slot="start"></ion-icon>
        <ion-label>Chat</ion-label>
      </ion-item>

      <!-- Reports Menu -->
      <ion-item button (click)="navigateTo('/reports')">
        <ion-icon name="stats-chart-outline" slot="start"></ion-icon>
        <ion-label>Reports</ion-label>
      </ion-item>

      <!-- Face-Recognition Menu -->
      <ion-item button (click)="navigateTo('/face-recognition')">
        <ion-icon name="scan-outline" slot="start"></ion-icon>
        <ion-label>Face-Recognition</ion-label>
      </ion-item>

      <!-- Forms Menu -->
      <ion-item button (click)="navigateTo('/forms')">
        <ion-icon name="document-text-outline" slot="start"></ion-icon>
        <ion-label>Forms</ion-label>
      </ion-item>

           <!-- Organizational Chart Menu -->
      <ion-item button (click)="navigateTo('/organizational-chart')">
        <ion-icon name="git-network-outline" slot="start"></ion-icon>
        <ion-label>Organizational Chart</ion-label>
      </ion-item>

      <!-- Components Menu -->
      <ion-item button (click)="navigateTo('/component')">
        <ion-icon name="code-slash-outline" slot="start"></ion-icon>
        <ion-label>Components</ion-label>
      </ion-item>

      <!-- Logout -->
      <ion-item button class="logout-item" (click)="logout()">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        <ion-label>Logout</ion-label>
      </ion-item>

    </ion-list>
  </div>
</ion-header>
