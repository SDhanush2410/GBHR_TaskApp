
<ion-content class="login-content">

  <div class="login-container">

    <div class="login-icon">
      <ion-icon name="chatbubbles-outline"></ion-icon>
    </div>

    <h1>Firebase Test Login</h1>

    <p>Sign in with your Firebase test employee account.</p>

    <form (ngSubmit)="login()">

      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input
          type="email"
          [(ngModel)]="email"
          name="email"
          required>
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Password</ion-label>

        <ion-input
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          required>
        </ion-input>

        <ion-button
          fill="clear"
          slot="end"
          type="button"
          (click)="showPassword = !showPassword">

          <ion-icon
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'">
          </ion-icon>

        </ion-button>
      </ion-item>

      <p class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <ion-button
        expand="block"
        type="submit"
        [disabled]="isLoading || !email.trim() || !password">

        <ion-spinner
          *ngIf="isLoading"
          name="crescent">
        </ion-spinner>

        <span *ngIf="!isLoading">Login with Firebase</span>

      </ion-button>

    </form>

    <p class="test-note">
      This page is only for testing Firebase Chat.
      It does not replace GB HERMES login.
    </p>

  </div>

</ion-content>
